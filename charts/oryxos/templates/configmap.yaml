{{- if and (eq .Values.workspace.provider "shared-posix") (empty .Values.workspace.identity) -}}
{{- fail "workspace.identity is required for shared-posix; pre-provision .workspace-id on the shared volume" -}}
{{- end -}}
{{- /* 零明文纪律：凭证只走 Secret 环境变量，绝不出现在本 ConfigMap。
       extraConfig 与固定注入项做深合并（固定项优先——cluster.enabled 等不可被覆盖），
       避免顶层重复键（SnakeYAML 后者胜会静默吞掉集群档开关）。 */ -}}
{{- $base := dict
      "oryxos" (dict "cluster" (dict "enabled" true) "workspace" (dict "storage" (dict "provider" .Values.workspace.provider "identity" .Values.workspace.identity)))
      "spring" (dict "lifecycle" (dict "timeout-per-shutdown-phase" .Values.shutdown.drainTimeout)) -}}
{{- if .Values.otel.endpoint -}}
{{- $_ := set (get $base "oryxos") "otel" (dict "endpoint" .Values.otel.endpoint "sampler-ratio" .Values.otel.samplerRatio) -}}
{{- end -}}
{{- if .Values.otel.metricsEndpoint -}}
{{- $_ := set $base "management" (dict "otlp" (dict "metrics" (dict "export" (dict "enabled" true "url" .Values.otel.metricsEndpoint)))) -}}
{{- end -}}
{{- $merged := mergeOverwrite (deepCopy .Values.extraConfig) $base -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oryxos.fullname" . }}-config
  labels:
    {{- include "oryxos.labels" . | nindent 4 }}
data:
  application.yml: |
    {{- toYaml $merged | nindent 4 }}
