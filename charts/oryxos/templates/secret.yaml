{{- /* 仅当未用 existingSecret 而在 values 直填时渲染（生产推荐 existingSecret；helm 场景值仍不落 ConfigMap/注解） */ -}}
{{- if and (not .Values.database.existingSecret) .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oryxos.fullname" . }}-db
  labels:
    {{- include "oryxos.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: {{ .Values.database.url | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
{{- if and (not .Values.masterKey.existingSecret) .Values.masterKey.value }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oryxos.fullname" . }}-master-key
  labels:
    {{- include "oryxos.labels" . | nindent 4 }}
type: Opaque
stringData:
  ORYXOS_MASTER_KEY: {{ .Values.masterKey.value | quote }}
{{- end }}
