apiVersion: v1
kind: Service
metadata:
  name: {{ include "oryxos.fullname" . }}
  labels:
    {{- include "oryxos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "oryxos.selectorLabels" . | nindent 4 }}
