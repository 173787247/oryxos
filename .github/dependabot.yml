version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(maven)"
    groups:
      # Routine upgrades share one PR; major upgrades stay separate for migration review.
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Action updates are normally compatible and easier to review as one CI-only PR.
      github-actions:
        patterns:
          - "*"
