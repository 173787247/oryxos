# Independent Java SAST for #453 — separate workflow so the CI `build` job
# stays fast, and tip pushes are never path-skipped (skipped ≠ pass).
name: CodeQL

on:
  push:
    branches: [main, 'week-*', 'dev-*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly baseline refresh on default branch (optional; tip still covered by push).
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Default security queries only; promote to security-extended only if green.

      - name: Build (Maven package, skip tests & quality)
        # Manual build between init and analyze (no autobuild) so quality plugins
        # already covered by CI `build` do not fail or slow this SAST job.
        run: >-
          mvn -B -DskipTests package
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
