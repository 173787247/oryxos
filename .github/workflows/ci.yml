name: CI

on:
  push:
    branches: [main, 'week-*', 'dev-*']
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - '**.md'
      - 'docs/**'

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

# One run per PR / branch; cancel superseded pushes to save runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Long-lived PRs fail OWASP when main adds CVE suppressions they have not merged.
  # Fail fast if those files lag the PR base; other drift is still the author's call.
  # On push to main (and other push branches): compare against the previous SHA so the
  # job always runs (skipped ≠ pass for the all-success bar).
  owasp-baseline:
    name: OWASP baseline vs main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare suppressions and root POM to base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zeros="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            base="origin/${BASE_REF}"
            base_label="$BASE_REF"
          else
            before="${BEFORE_SHA:-}"
            if [ -z "$before" ] || [ "$before" = "$zeros" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                before="$(git rev-parse HEAD~1)"
              else
                echo "No previous commit available; nothing to compare."
                exit 0
              fi
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$before" 2>/dev/null || true
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                before="$(git rev-parse HEAD~1)"
              else
                echo "Previous SHA unavailable; nothing to compare."
                exit 0
              fi
            fi
            base="$before"
            base_label="$before"
          fi
          if git merge-base --is-ancestor "$base" HEAD; then
            echo "Branch already contains $base_label."
            exit 0
          fi
          echo "Branch is $(git rev-list --count HEAD.."$base") commit(s) behind $base_label."
          changed=0
          for f in config/dependency-check-suppressions.xml pom.xml; do
            if ! git diff --quiet "$base" -- "$f"; then
              echo "::error file=$f::$f differs from ${base_label}. Merge main so OWASP suppressions stay in sync."
              git --no-pager diff --stat "$base" -- "$f"
              changed=1
            fi
          done
          if [ "$changed" -ne 0 ]; then
            echo "Run: make sync-upstream && mvn -B verify"
            exit 1
          fi
          echo "Behind $base_label, but OWASP/pom baseline files match."

  build:
    name: Build & quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Full quality gate: spotless → checkstyle → compile → test → pmd/p3c →
      # spotbugs+findsecbugs. Any violation fails the job.
      - name: mvn verify
        run: mvn -B clean verify

  dependency-check:
    name: OWASP Dependency-Check (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Install this reactor before aggregation so cached first-party jars cannot
      # substitute an older frontend bundle during dependency resolution.
      # Skip quality plugins already covered by `build`, then run
      # Dependency-Check aggregate. Avoids a second spotless/pmd/spotbugs pass
      # that duplicated ~half the CI time and made CVE failures hard to spot.
      # NVD feed uses Dependency-Check's nightly cache (no NVD API key for forks).
      - name: install current reactor (skip quality plugins)
        run: >-
          mvn -B clean install -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: Verify security exclusion assumptions
        run: |
          python3 scripts/test-security-assumptions.py
          mkdir -p target
          mvn -B -pl oryxos-boot -am dependency:tree -Dscope=runtime > target/security-dependency-tree.txt
          python3 scripts/check-security-assumptions.py --dependency-tree target/security-dependency-tree.txt
      - name: OWASP dependency-check aggregate
        run: mvn -B -Dowasp.skip=false org.owasp:dependency-check-maven:aggregate
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore

  docker-build:
    name: Docker image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 只验证镜像可构建（Dockerfile + 上下文不腐烂），不推送；
      # 测试与质量门禁已在 build job 覆盖，这里跳过以省时
      - name: package (skip tests & quality plugins)
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
      - name: docker build
        run: docker build -t oryxos:ci .

  integration-tests:
    name: Integration tests (*IT, embedded PG)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # #453：boot 模块的 *IT（双副本恰好一次 / 文件面可见性 / 故障接管 / 迁移演进等，zonky 嵌入式 PG）
      # 不在 surefire 默认 include，此前从不进门禁——曾漏检两处基线失败（039 落卷有案）。
      # 本 job 显式纳管；@Tag("integration")（真 key / 外部实例 / 重复整机）维持排除，
      # LiveApiIT 探活失败自动跳过。独立 job 不拖慢本地 mvn verify。
      - name: install modules (skip tests & quality)
        run: >-
          mvn -B clean install -DskipTests
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
          -Dpmd.skip=true -Dspotbugs.skip=true
      - name: run boot *IT
        run: >-
          mvn -B -pl oryxos-boot test -Dtest='*IT'
          -DexcludedGroups=integration
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
          -Dpmd.skip=true -Dspotbugs.skip=true

  helm:
    name: Helm chart lint + kind install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 039 门禁档：lint + template + kubeconform + 结构断言（无集群面）
      - name: install helm & kubeconform
        run: bash scripts/install-k8s-tools.sh gate
      - name: helm verify (lint/template/schema/assertions)
        run: bash scripts/helm-verify.sh
      # 039 门禁档（analyze C1）：CI runner 自带 docker——kind 安装冒烟属可自动化面。
      # 构建镜像 → kind load → 附带 PG → helm install → 双副本就绪 + 实例双活断言（SC-001 自动化）
      - name: package jar
        run: >-
          mvn -B clean package -DskipTests
          -Dspotless.check.skip=true -Dcheckstyle.skip=true
          -Dpmd.skip=true -Dspotbugs.skip=true
      - name: docker build
        run: docker build --build-arg JAR_FILE=oryxos-boot/target/oryxos-boot-*.jar -t oryxos:ci .
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: oryxos-ci
      - name: kind install smoke
        run: bash scripts/kind-smoke.sh oryxos:ci
